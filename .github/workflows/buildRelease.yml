name: Build and Release HTML-Attribute-Folder
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get branch name
        id: get_branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" == "tag" ]; then
            BRANCH=$(git branch --contains "$(git rev-parse HEAD)" | grep -v "detached" | sed 's/* //')
            echo "BRANCH_NAME=${BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Get the version
        id: get_version
        run: echo "TAGGED_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Debug
        shell: bash
        run: |
          echo "Version: ${{ steps.get_version.outputs.TAGGED_VERSION }}"
          echo "Branch:  ${{ steps.get_branch.outputs.BRANCH_NAME }}"


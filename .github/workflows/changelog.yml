name: Generate HTML-Attribute-Folder-Changelog
on:
  workflow_run:
    workflows:
      - Build HTML-Attribute-Folder
    types:
      - completed
jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Get the version
        id: get_version
        run: echo "TAGGED_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Generate Changelog
        uses: BobAnkh/auto-generate-changelog@v1.2.5
        with:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: 'docs(CHANGELOG): 📚 Update release notes'
          TYPE: 'feat:Feature,fix:Fixes,chore:Fixes,docs:Documentation,refactor:Refactor'
      - name: Update Git Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "CURRENT_TAG=${{ steps.get_version.outputs.CURRENT_TAG }}"
          git tag -d "${{ steps.get_version.outputs.CURRENT_TAG }}"
          git tag "${{ steps.get_version.outputs.CURRENT_TAG }}"
          git push origin "${{ steps.get_version.outputs.CURRENT_TAG }}" --force
